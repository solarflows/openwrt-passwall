name: "Sync Upstream and Rebase Main"

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync and rebase even if upstream is unchanged'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync_and_rebase:
    name: Sync and Rebase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream_remote https://github.com/Openwrt-Passwall/openwrt-passwall.git || git remote set-url upstream_remote https://github.com/Openwrt-Passwall/openwrt-passwall.git
          git fetch upstream_remote --tags --force
          git fetch upstream_remote main

      - name: Check for upstream updates
        id: check_update
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream_remote/main)
          PREV_UPSTREAM_SHA=$(git merge-base upstream_remote/main origin/main 2>/dev/null || git rev-parse origin/upstream 2>/dev/null || echo "")
          echo "Upstream main commit:     ${UPSTREAM_SHA}"
          echo "Previous upstream commit: ${PREV_UPSTREAM_SHA}"
          echo "prev_upstream_sha=${PREV_UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "${UPSTREAM_SHA}" origin/main 2>/dev/null && [ "${{ inputs.force_sync }}" != "true" ]; then
            echo "Upstream main is already integrated into local main branch. Nothing to do."
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream changes detected."
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync main branch with upstream
        id: sync
        if: steps.check_update.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout main
          UPSTREAM_SHA="${{ steps.check_update.outputs.upstream_sha }}"
          SHORT_SHA="${UPSTREAM_SHA:0:8}"
          echo "Syncing upstream ($SHORT_SHA) into main..."

          if ! git merge --no-edit -m "merge: sync upstream ($SHORT_SHA)" upstream_remote/main; then
            echo "::warning::Initial merge encountered conflict. Attempting automated resolution on whitelist..."
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
            echo "Conflicted files: $CONFLICT_FILES"

            # 仅允许合并已验证安全的非业务逻辑外围文件
            if echo "$CONFLICT_FILES" | grep -qx "\.github/workflows/Auto compile with openwrt sdk\.yml"; then
              git checkout --ours ".github/workflows/Auto compile with openwrt sdk.yml"
              git add ".github/workflows/Auto compile with openwrt sdk.yml"
              echo "Auto-resolved workflow conflict using downstream version."
            fi

            if echo "$CONFLICT_FILES" | grep -qx "luci-app-passwall/luasrc/view/passwall/global/status\.htm"; then
              python3 -c "import re, sys; p='luci-app-passwall/luasrc/view/passwall/global/status.htm'; c=open(p,'r',encoding='utf-8').read(); n=re.sub(r'<{7}[^\n]*\n(.*?)\n={7}\n(.*?)\n>{7}[^\n]*', lambda m: m.group(1) if 'check_ip_info' in m.group(1) else m.group(2), c, flags=re.S); open(p,'w',encoding='utf-8').write(n); sys.exit(0 if '<<<<<<<' not in n else 1)"
              git add luci-app-passwall/luasrc/view/passwall/global/status.htm
              echo "Auto-resolved status.htm conflict preserving check_ip_info."
            fi

            if echo "$CONFLICT_FILES" | grep -qx "luci-app-passwall/po/zh-cn/passwall\.po"; then
              python3 -c "import re; p='luci-app-passwall/po/zh-cn/passwall.po'; c=open(p,'r',encoding='utf-8').read(); open(p,'w',encoding='utf-8').write(re.sub(r'<{7}[^\n]*\n(.*?)\n={7}\n(.*?)\n>{7}[^\n]*', lambda m: m.group(1).strip() + '\n\n' + m.group(2).strip(), c, flags=re.S))"
              git add luci-app-passwall/po/zh-cn/passwall.po
              echo "Auto-resolved passwall.po translation conflict."
            fi

            # 严苛熔断：除白名单外，任何实质代码冲突绝对禁止脚本擅自猜测，直接 abort 退出
            REMAINING_CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [ -n "$REMAINING_CONFLICTS" ]; then
              echo "::error::Substantive code conflict detected in files: $REMAINING_CONFLICTS. Aborting merge to protect custom features."
              git diff
              git merge --abort
              exit 1
            fi

            # 核心防线：解决冲突后检测暂存区是否有实质代码改动，杜绝空白 Merge
            if git diff --cached --quiet; then
              echo "::warning::Merge resulted in 0 byte code changes against HEAD. Aborting merge to prevent empty merge commit."
              git merge --abort
              echo "has_code_update=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "merge: sync upstream ($SHORT_SHA) with auto-resolved conflicts"
            echo "Merge conflicts resolved successfully."
          fi

          # 自研特性完整性门禁
          for f in $(git ls-files "*.sh"); do
            bash -n "$f" || { echo "::error::Shell syntax validation failed on $f"; exit 1; }
          done
          for sig in "psw_custom" "smartdns-shared" "get_node_fingerprint"; do
            grep -rq "$sig" luci-app-passwall/ || { echo "::error::Missing custom feature signature: $sig"; exit 1; }
          done

          # 审计代码逻辑变更以仲裁是否发版
          CODE_DIFF_LINES=$(git diff HEAD^1 HEAD -- luci-app-passwall/ | wc -l)
          CUR_VER=$(awk -F ':=' '/^PKG_VERSION:=/ {print $2}' luci-app-passwall/Makefile | tr -d ' \t\r\n')
          LATEST_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
          LATEST_MAIN_VER="${LATEST_TAG%-*}"

          if [ "$CUR_VER" != "$LATEST_MAIN_VER" ]; then
            echo "Major version bump detected (${LATEST_MAIN_VER} -> ${CUR_VER}). Triggering compile."
            echo "has_code_update=true" >> "$GITHUB_OUTPUT"
          elif [ "$CODE_DIFF_LINES" -gt 0 ]; then
            echo "Substantive code changes detected (${CODE_DIFF_LINES} lines diff in luci-app-passwall). Triggering compile."
            echo "has_code_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "No substantive code changes in luci-app-passwall. Skipping auto-compile."
            echo "has_code_update=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Sync completed successfully."
          git checkout -B upstream "$UPSTREAM_SHA"
          git push origin upstream --force-with-lease || echo "::warning::Failed to update upstream branch"
          git push origin --tags --force 2>/dev/null || true
          git checkout main
          git push origin main --force-with-lease
          git checkout -B custom main
          git push origin custom --force-with-lease

      - name: Trigger compile workflow
        if: steps.sync.outputs.has_code_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering Auto compile workflow for main branch..."
          gh workflow run "Auto compile with openwrt sdk" --ref main || echo "::warning::Failed to trigger compile workflow"
