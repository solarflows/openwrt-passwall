name: "Auto compile with openwrt sdk"
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      prerelease:
        description: 'Publish as Pre-release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Custom tag name override'
        required: false
        type: string
  workflow_call:
    inputs:
      target_ref:
        description: 'Target ref or branch to compile'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Publish as Pre-release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Custom tag name override'
        required: false
        type: string
        default: ''
      force_compile:
        description: 'Force compile even if tag already exists'
        required: false
        type: boolean
        default: false
env:
  TZ: Asia/Shanghai
  passwall: ${{ github.repository }}
  packages: Openwrt-Passwall/openwrt-passwall-packages

permissions:
  contents: write
  actions: write

jobs:
  job_check:
    name: Check Version
    runs-on: ubuntu-26.04
    outputs:
      passwall_version: ${{ steps.check_version.outputs.latest_version }}
      previous_version: ${{ steps.check_version.outputs.previous_version }}
      has_update: ${{ steps.check_version.outputs.has_update }}
      prerelease: ${{ steps.check_version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref || github.ref_name }}

      - name: Check version
        id: check_version
        env:
          url_tags: https://api.github.com/repos/${{ env.passwall }}/releases/latest
        run: |
          target_ref="${{ inputs.target_ref || github.ref_name }}"
          custom_tag="${{ inputs.tag_name }}"
          force_compile="${{ inputs.force_compile }}"

          if [ -n "$custom_tag" ]; then
            latest_version="$custom_tag"
          else
            cd luci-app-passwall
            latest_version=$(awk -F ':=' '/^PKG_VERSION:=|^PKG_RELEASE:=/ {print $2}' Makefile | sed ':a;N;s/\$(PKG_VERSION)-//;s/\n$//;s/\n/-/;ba')
            if [ "$target_ref" = "rolling" ]; then
              latest_version="${latest_version}-rolling.$(date +%Y%m%d%H%M)"
            fi
            cd ..
          fi
          echo "latest_version=${latest_version}" >> $GITHUB_OUTPUT

          if [ -n "${{ inputs.prerelease }}" ]; then
            prerelease="${{ inputs.prerelease }}"
          elif [ "$target_ref" = "rolling" ]; then
            prerelease=true
          elif [ "$target_ref" = "main" ] || [ "$target_ref" = "custom" ]; then
            prerelease=false
          else
            prerelease=true
          fi
          echo "prerelease=${prerelease}" >> $GITHUB_OUTPUT

          remote_latest_version=$(wget -qO- -t1 -T2 ${{env.url_tags}} | jq -r '.tag_name')

          if [ -z "$remote_latest_version" ] || [ "$remote_latest_version" = "null" ]; then
            echo "Failed to fetch remote tags"
            echo "has_update=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Remote latest: $remote_latest_version"
          echo "previous_version=${remote_latest_version}" >> $GITHUB_OUTPUT

          if [ "$force_compile" = "true" ]; then
            echo "Force compile enabled"
            echo "has_update=true" >> $GITHUB_OUTPUT
          elif [ "$latest_version" = "$remote_latest_version" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release
        if: steps.check_version.outputs.has_update == 'true'
        run: |
          git fetch --tags --force 2>/dev/null || true
          latest_ver="${{ steps.check_version.outputs.latest_version }}"
          prev_ver="${{ steps.check_version.outputs.previous_version }}"
          target_ref="${{ inputs.target_ref || github.ref_name }}"

          if [ "$target_ref" = "rolling" ]; then
            branch_info="> 📌 **源码分支**：[\`rolling\`](https://github.com/${{ env.passwall }}/tree/rolling)（前沿滚动置顶分支，先行 Pre-release 体验版）"
          else
            branch_info="> 📌 **源码分支**：[\`custom\`](https://github.com/${{ env.passwall }}/tree/custom) / [\`main\`](https://github.com/${{ env.passwall }}/tree/main)（基于官方上游 \`upstream\` 同步构建）"
          fi

          changelog=""
          compare_link=""
          if [ -n "$prev_ver" ] && git rev-parse -q --verify "refs/tags/${prev_ver}" >/dev/null 2>&1; then
            changelog=$(git log --no-merges --pretty=format:"* [\`%h\`](https://github.com/${{ env.passwall }}/commit/%H) %s" "${prev_ver}..HEAD")
            compare_url="https://github.com/${{ env.passwall }}/compare/${prev_ver}...${latest_ver}"
            compare_link="> 🔍 **完整变更对比**：[${prev_ver} ... ${latest_ver}](${compare_url})"
          fi

          if [ -z "$changelog" ]; then
            changelog=$(git log -n 10 --no-merges --pretty=format:"* [\`%h\`](https://github.com/${{ env.passwall }}/commit/%H) %s" HEAD)
          fi

          cat << EOF > release.txt
          ![](https://img.shields.io/github/downloads/${{ env.passwall }}/${latest_ver}/total?style=flat-square)

          ${branch_info}
          ${compare_link}

          ### 📝 本次更新日志 (${prev_ver:-init} -> ${latest_ver})

          EOF

          printf "%s\n\n" "$changelog" >> release.txt

          cat << 'EOF' >> release.txt
          ---

          ### 📌 核心功能与架构特性

          本仓库基于官方 PassWall 最新版本构建，保留官方原有功能，主要包含以下调整：
          * **SmartDNS 双模式架构**：
            * **系统共享/单进程优化 (`smartdns-shared`)**：复用宿主系统 SmartDNS 单进程，共享国内 warm 缓存池，`:15355` 直连承载跳过 dnsmasq 中间层；`:15354@lo` 独占纯净 Anycast DoH（阿里+字节）专属节点直连组（`passwall_vps`），控制面与数据面物理隔离。
            * **独立守护进程 (`smartdns`)**：100% 保持官方上游独立子进程原生逻辑（0 diff、0 hook），内置独立 WebUI 与日志。
          * **特权优先自定义代理集合 (`custom_proxy`)**：在 ACL 判定前置位插入针对 `psw_custom` 集合的直通引流，局域网直连设备无感代理特定服务。
          * **订阅与节点处理**：基于物理连接拓扑提取纯净哈希指纹，解耦动态流量/到期备注，脏检查零 Flash 磨损与 0 断网刷新。
          * **分流模式缓存双锁死**：前端锁死隐藏缓存模式，后端强制注入 `-no-cache` 与 `-no-serve-expired`，保障 URLTest 动态测速瞬间生效。
          * **防火墙与转发**：出站链增加 `PSW_FAST_RETURN` 短路规则，调整 `rp_filter` 参数以减少出站开销。

          ---

          ### 📦 安装包选择

          请根据您的系统固件版本下载对应的安装包（主程序 + 中文包）：

          | 固件系统版本 | 适用环境 | 主程序包 | 界面语言包 |
          | :--- | :--- | :--- | :--- |
          | **OpenWrt 25.12+** | 采用 apk 包管理的新架构固件 | `25.12+_luci-app-passwall-*.apk` | `25.12+_luci-i18n-passwall-zh-cn-*.apk` |
          | **OpenWrt 23.05 ~ 24.10** | 主流正式版 / ImmortalWrt 23/24（opkg） | `23.05-24.10_luci-app-passwall_*.ipk` | `23.05-24.10_luci-i18n-passwall-zh-cn_*.ipk` |
          | **OpenWrt 22.03 及旧版** | 22.03 / 21.02 等旧版（opkg） | `22.03-_luci-app-passwall_*.ipk` | `22.03-_luci-i18n-passwall-zh-cn_*.ipk` |

          ---

          ### 🔑 导入签名公钥

          安装包已使用独立密钥签名。如需验证签名，可在安装前将公钥导入设备：

          #### 1. IPK (OpenWrt 24.10 及更早版本)
          公钥文件：`solarflows-usign-public.pub`

          * **在线下载导入**（路由器终端执行）：
            ```sh
            curl -sSL -k "https://github.com/${{ env.passwall }}/releases/latest/download/solarflows-usign-public.pub" -o /etc/opkg/keys/solarflows.pub
            ```
          * **安装命令**：
            ```sh
            opkg install luci-app-passwall_*.ipk luci-i18n-passwall-zh-cn_*.ipk
            ```

          #### 2. APK (OpenWrt 25.12+ 新架构)
          公钥文件：`solarflows-apk-public.pem`

          * **在线下载导入**（路由器终端执行）：
            ```sh
            mkdir -p /etc/apk/keys
            curl -sSL -k "https://github.com/${{ env.passwall }}/releases/latest/download/solarflows-apk-public.pem" -o /etc/apk/keys/solarflows.pem
            ```
          * **安装命令**：
            ```sh
            apk add luci-app-passwall-*.apk luci-i18n-passwall-zh-cn-*.apk
            # 若未导入公钥，可临时允许未信任安装：
            # apk add --allow-untrusted luci-app-passwall-*.apk luci-i18n-passwall-zh-cn-*.apk
            ```

          ---

          ### 💡 依赖说明
          PassWall 运行所需内核组件（如 Sing-Box、Xray、ChinaDNS-NG 等），可参考 [openwrt-passwall-build](https://github.com/moetayuko/openwrt-passwall-build) 软件源或从 [SourceForge](https://sourceforge.net/projects/openwrt-passwall-build/files/) 获取预编译包。

          ---

          ### 🚀 配套固件与工具 / Firmwares & Tools
          * **[OpenWrtAction](https://github.com/smallprogram/OpenWrtAction)** —— 集成 PassWall 的 CI 固件，支持 x86、R2S、R4S、R5S、H68K 等，支持 GitHub 一键在线更新固件。
          * **[Are-u-ok](https://github.com/bcseputetto/Are-u-ok)** —— iStoreOS .run 更新包，上传执行即可直接安装/升级。
          EOF
          touch release.txt

      - name: Generate new tag & release
        if: steps.check_version.outputs.has_update == 'true'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{steps.check_version.outputs.latest_version}}
          target_commitish: ${{ inputs.target_ref || github.ref_name }}
          prerelease: ${{steps.check_version.outputs.prerelease}}
          body_path: release.txt


  job_build_passwall:
    name: Build passwall [${{ matrix.ver }}]
    needs: job_check
    if: needs.job_check.outputs.has_update == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - container_tag: x86_64-21.02.7
            ver: "22.03-"

          - container_tag: x86_64-24.10.5
            ver: "23.05-24.10"

          - container_tag: x86-64-SNAPSHOT
            ver: "25.12+"
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: ${{ inputs.target_ref || github.ref_name }}

      - name: Generate .config for Language Packs
        run: |
          echo "CONFIG_ALL_NONSHARED=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL=n" >> .config
          echo "CONFIG_AUTOREMOVE=n" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall=m" >> .config

      - name: Compile With OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.container_tag }}
          PACKAGES: luci-app-passwall
          INDEX: 1
          KEY_BUILD: ${{ secrets.USIGN_KEY }}
          PRIVATE_KEY: ${{ secrets.APK_BUILD_KEY }}
          # V: s

      - name: Process and Rename Artifacts
        id: compile
        run: |
          mkdir -p ${{ github.workspace }}/upload

          # 使用 find 安全提取生成的 ipk/apk 及语言包
          find bin/packages/ -type f -name "luci-app-passwall*" -exec cp {} ${{ github.workspace }}/upload/ \;
          find bin/packages/ -type f -name "luci-i18n-passwall*" -exec cp {} ${{ github.workspace }}/upload/ \;

          cd ${{ github.workspace }}/upload

          for i in $(ls); do mv $i ${{ matrix.ver }}_$i; done

          # 导出签名公钥文件并随 release 一同发布
          if [ "${{ matrix.ver }}" = "25.12+" ] && [ -n "${{ secrets.APK_BUILD_KEY }}" ]; then
            printf '%s' "${{ secrets.APK_BUILD_KEY }}" > /tmp/apk-sec.pem
            openssl ec -in /tmp/apk-sec.pem -pubout -out ${{ github.workspace }}/upload/solarflows-apk-public.pem 2>/dev/null || true
            rm -f /tmp/apk-sec.pem
          elif [ "${{ matrix.ver }}" != "25.12+" ] && [ -n "${{ secrets.USIGN_KEY }}" ]; then
            printf '%s\n' "${{ secrets.USIGN_KEY }}" > /tmp/key-build
            KEY_B64=$(grep -v '^untrusted comment:' /tmp/key-build | tr -d '\n')
            printf '%s' "$KEY_B64" | base64 -d > /tmp/.seckey.bin 2>/dev/null || true
            if [ "$(wc -c < /tmp/.seckey.bin 2>/dev/null)" = "104" ]; then
              FP=$(dd if=/tmp/.seckey.bin bs=1 skip=32 count=8 2>/dev/null | od -An -tx8 | tr -d ' \n')
              {
                printf 'untrusted comment: public key %s\n' "$FP"
                { printf 'Ed'; dd if=/tmp/.seckey.bin bs=1 skip=32 count=8 2>/dev/null; dd if=/tmp/.seckey.bin bs=1 skip=72 count=32 2>/dev/null; } | base64 -w 0
                printf '\n'
              } > ${{ github.workspace }}/upload/solarflows-usign-public.pub
            fi
            rm -f /tmp/key-build /tmp/.seckey.bin
          fi

          echo "status=success" >> $GITHUB_OUTPUT
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{needs.job_check.outputs.passwall_version}}
          files: ${{ github.workspace }}/upload/*

  job_trigger_packages:
    name: Trigger packages cache workflow
    needs: [job_check, job_build_passwall]
    if: needs.job_check.outputs.has_update == 'true' && needs.job_build_passwall.result == 'success' && github.repository == 'Openwrt-Passwall/openwrt-passwall'
    runs-on: ubuntu-26.04
    steps:
      - name: Trigger Auto Cache Software Release JSONs
        env:
          # PAT with "Actions: write" permission on the packages repository
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
        run: |
          gh workflow run "Auto cache software release jsons.yml" \
            --repo "${{ env.packages }}" \
            --ref main
