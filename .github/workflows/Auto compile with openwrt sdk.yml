name: "Auto compile with openwrt sdk"
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
env:
  TZ: Asia/Shanghai
  passwall: ${{ github.repository }}
  packages: Openwrt-Passwall/openwrt-passwall-packages

permissions:
  contents: write
  actions: write

jobs:
  job_check:
    name: Check Version
    runs-on: ubuntu-26.04
    outputs:
      passwall_version: ${{ steps.check_version.outputs.latest_version }}
      has_update: ${{ steps.check_version.outputs.has_update }}
      prerelease: ${{ steps.check_version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check version
        id: check_version
        env:
          url_tags: https://api.github.com/repos/${{ env.passwall }}/releases/latest
        run: |
          cd luci-app-passwall
          latest_version=$(awk -F ':=' '/^PKG_VERSION:=|^PKG_RELEASE:=/ {print $2}' Makefile | sed ':a;N;s/\$(PKG_VERSION)-//;s/\n$//;s/\n/-/;ba')
          echo "latest_version=${latest_version}" >> $GITHUB_OUTPUT

          prerelease=$([ "${{ github.ref_name }}" == "main" ] && echo false || echo true)
          echo "prerelease=${prerelease}" >> $GITHUB_OUTPUT

          remote_latest_version=$(wget -qO- -t1 -T2 ${{env.url_tags}} | jq -r '.tag_name')

          if [ -z "$remote_latest_version" ] || [ "$remote_latest_version" = "null" ]; then
            echo "Failed to fetch remote tags"
            echo "has_update=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Remote latest: $remote_latest_version"

          if [ "$latest_version" = "$remote_latest_version" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release
        if: steps.check_version.outputs.has_update == 'true'
        run: |
          echo "![](https://img.shields.io/github/downloads/${{ env.passwall }}/${{steps.check_version.outputs.latest_version}}/total?style=flat-square)" >> release.txt
          echo "## :mega: 获取其他软件包 / How to Get Other Packages" >>release.txt
          echo "" >>release.txt
          echo "### 方式 1：添加软件源 / Method 1: Add Software Source" >>release.txt
          echo " * 请按照 [openwrt-passwall-build](https://github.com/moetayuko/openwrt-passwall-build) 仓库的说明，将其提供的软件源添加到设备中，然后直接使用包管理器安装。" >>release.txt
          echo "  Follow the instructions in the [openwrt-passwall-build](https://github.com/moetayuko/openwrt-passwall-build) repository to add the provided software source to your device, then install directly using the package manager." >>release.txt
          echo "" >>release.txt
          echo "### 方式 2：手动下载并安装 / Method 2: Manual Download and Install" >>release.txt
          echo "" >>release.txt
          echo "* 从 [SourceForge](https://sourceforge.net/projects/openwrt-passwall-build/files/) 下载预构建的软件包。" >>release.txt
          echo "  Download prebuilt packages from [SourceForge](https://sourceforge.net/projects/openwrt-passwall-build/files/)." >>release.txt
          echo "" >>release.txt
          echo "* 将文件上传到您的设备，使用 Shell 命令进行安装。" >>release.txt
          echo "  Upload files to your device, install it with shell command." >>release.txt
          echo "" >>release.txt
          echo "### 软件包签名说明 / Package Signature Verification" >>release.txt
          echo "本构建包已注入与 AutoWorkFlows 统一的数字签名，附件中附带对应公钥文件：" >>release.txt
          echo "* **IPK (opkg)**: 导入 \`solarflows-usign-public.pub\` 至设备 \`/etc/opkg/keys/\` 目录。" >>release.txt
          echo "* **APK (apk)**: 导入 \`solarflows-apk-public.pem\` 至设备 \`/etc/apk/keys/\` 目录。" >>release.txt
          echo "" >>release.txt
          echo "ipk" >>release.txt
          echo "\`\`\`" >>release.txt
          echo "opkg install /path/to/package.ipk" >>release.txt
          echo "\`\`\`" >>release.txt
          echo "apk" >>release.txt
          echo "\`\`\`" >>release.txt
          echo "apk add /path/to/package.apk" >>release.txt
          echo "\`\`\`" >>release.txt
          echo "" >>release.txt
          echo ":warning: 请将 /path/to/package 替换为实际下载的软件包路径。" >>release.txt
          echo "- Replace /path/to/package with the actual path of the downloaded packages." >>release.txt
          touch release.txt

      - name: Generate new tag & release
        if: steps.check_version.outputs.has_update == 'true'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{steps.check_version.outputs.latest_version}}
          target_commitish: ${{ github.ref_name }}
          prerelease: ${{steps.check_version.outputs.prerelease}}
          body_path: release.txt


  job_build_passwall:
    name: Build passwall [${{ matrix.ver }}]
    needs: job_check
    if: needs.job_check.outputs.has_update == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - container_tag: x86_64-21.02.7
            ver: "22.03-"

          - container_tag: x86_64-24.10.5
            ver: "23.05-24.10"

          - container_tag: x86-64-SNAPSHOT
            ver: "25.12+"
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Generate .config for Language Packs
        run: |
          echo "CONFIG_ALL_NONSHARED=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL=n" >> .config
          echo "CONFIG_AUTOREMOVE=n" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall=m" >> .config

      - name: Compile With OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.container_tag }}
          PACKAGES: luci-app-passwall
          INDEX: 1
          KEY_BUILD: ${{ secrets.USIGN_KEY }}
          PRIVATE_KEY: ${{ secrets.APK_BUILD_KEY }}
          # V: s

      - name: Process and Rename Artifacts
        id: compile
        run: |
          mkdir -p ${{ github.workspace }}/upload

          # 使用 find 安全提取生成的 ipk/apk 及语言包
          find bin/packages/ -type f -name "luci-app-passwall*" -exec cp {} ${{ github.workspace }}/upload/ \;
          find bin/packages/ -type f -name "luci-i18n-passwall*" -exec cp {} ${{ github.workspace }}/upload/ \;

          cd ${{ github.workspace }}/upload

          for i in $(ls); do mv $i ${{ matrix.ver }}_$i; done

          # 导出签名公钥文件并随 release 一同发布
          if [ "${{ matrix.ver }}" = "25.12+" ] && [ -n "${{ secrets.APK_BUILD_KEY }}" ]; then
            printf '%s' "${{ secrets.APK_BUILD_KEY }}" > /tmp/apk-sec.pem
            openssl ec -in /tmp/apk-sec.pem -pubout -out ${{ github.workspace }}/upload/solarflows-apk-public.pem 2>/dev/null || true
            rm -f /tmp/apk-sec.pem
          elif [ "${{ matrix.ver }}" != "25.12+" ] && [ -n "${{ secrets.USIGN_KEY }}" ]; then
            printf '%s\n' "${{ secrets.USIGN_KEY }}" > /tmp/key-build
            KEY_B64=$(grep -v '^untrusted comment:' /tmp/key-build | tr -d '\n')
            printf '%s' "$KEY_B64" | base64 -d > /tmp/.seckey.bin 2>/dev/null || true
            if [ "$(wc -c < /tmp/.seckey.bin 2>/dev/null)" = "104" ]; then
              FP=$(dd if=/tmp/.seckey.bin bs=1 skip=32 count=8 2>/dev/null | od -An -tx8 | tr -d ' \n')
              {
                printf 'untrusted comment: public key %s\n' "$FP"
                { printf 'Ed'; dd if=/tmp/.seckey.bin bs=1 skip=32 count=8 2>/dev/null; dd if=/tmp/.seckey.bin bs=1 skip=72 count=32 2>/dev/null; } | base64 -w 0
                printf '\n'
              } > ${{ github.workspace }}/upload/solarflows-usign-public.pub
            fi
            rm -f /tmp/key-build /tmp/.seckey.bin
          fi

          echo "status=success" >> $GITHUB_OUTPUT
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{needs.job_check.outputs.passwall_version}}
          files: ${{ github.workspace }}/upload/*
