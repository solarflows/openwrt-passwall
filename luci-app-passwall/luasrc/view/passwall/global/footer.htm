<%
local map = self.map
local api = map.api
local appname = map.config
local sid = "@global[0]"
-%>
<style>
 #cbi-<%=appname%>-socks .td.cbi-value-field > div { 
	white-space: nowrap;
}
@media (max-width: 1152px) {
	 #cbi-<%=appname%>-socks .td.cbi-value-field > div {
		white-space: normal;
	}
}

@media screen and (max-width: 1152px) {
	#cbi-<%=appname%>-socks .cbi-section-table-titles {
		display: none !important;
	}
}
</style>
<script type="text/javascript">
	//<![CDATA[
	let global_id = "<%=sid%>";

	function to_edit_node(btn, stype) {
		if (!btn) return;
		if (!stype) return;
		let hidden_select = null;
		const stype_dom = document.getElementById("cbi-<%=appname%>-" + stype);
		if (!stype_dom) return;
		const selects = stype_dom.querySelectorAll('select[id^="cbid."][id*="."][id$="node"]');
		const idReg = /^cbid\..*\..*node$/;
		for (const sel of selects) {
			if ( idReg.test(sel.id) && getComputedStyle(sel).display === "none" && (sel.compareDocumentPosition(btn) & Node.DOCUMENT_POSITION_FOLLOWING)) {
				hidden_select = sel;
			}
		}
		if (!hidden_select) return;
		let node_select_value = hidden_select?.options[0]?.value;
		if (!node_select_value || node_select_value.indexOf("_default") === 0 || node_select_value.indexOf("_direct") === 0 || node_select_value.indexOf("_blackhole") === 0) {
			return;
		}
		let to_url = '<%=api.url("node_config")%>/' + node_select_value;
		if (node_select_value.indexOf("socks_") === 0) {
			to_url = '<%=api.url("socks_config")%>/' + node_select_value;
		}
		location.href = to_url;
	}

	const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

	async function go() {
		const _status = document.getElementsByClassName('_socks_status');
		for (let i = 0; i < _status.length; i++) {
			const id = _status[i].getAttribute("socks_id");
			XHR.get('<%=api.url("socks_status")%>', {
					index: i,
					id: id
				},
				function(x, result) {
					const socks = _status[i].querySelector('._socks');
					const http = _status[i].querySelector('._http');
					if (socks) {
						socks.textContent = result.socks_status ? "✓" : "X";
						socks.style.fontWeight = "bold";
						socks.style.color = result.socks_status ? "green" : "red";
					}
					if (http) {
						if (result.use_http) {
							http.textContent = result.http_status ? "✓" : "X";
							http.style.fontWeight = "bold";
							http.style.color = result.http_status ? "green" : "red";
						} else {
							http.textContent = "";
						}
					}
				}
			);
		}

		const global = document.getElementById("cbi-<%=appname%>-" + global_id);
		if (global) {
			// 分流规则节点提前加入 “编辑” 占位符，以保证节点列表左对齐
			document.querySelectorAll('.td[data-widget="nodes_listvalue"][data-name="_node"] > div').forEach(container => {
				if (!container.querySelector('.shunt-node-placeholder')) {
					const placeholder = document.createElement('div');
					placeholder.className = 'shunt-node-placeholder';
					placeholder.style.cssText = 'display:inline-flex; width:40px; flex-shrink:0;';
					container.appendChild(placeholder);
				}
			});

			await delay(100);

			const all_node = global.querySelectorAll("[id]");
			const reg1 = /^cbid\..*node\.main$/;
			//const reg1 = /^cbid\..*\.(tcp_node|udp_node)\.main$/;

			for (let i = 0; i < all_node.length; i++) {
				const el = all_node[i];
				if (!reg1.test(el.id)) continue;

				const node_select = el;
				if (!node_select) continue;
				const cbid = el.id.replace(/\.main$/, "");
				const hidden_select = document.getElementById(cbid);
				const node_select_value = hidden_select?.options[0]?.value;
				if (!node_select_value || node_select_value.indexOf("tcp") === 0 || node_select_value.indexOf("_default") === 0 || node_select_value.indexOf("_direct") === 0 || node_select_value.indexOf("_blackhole") === 0) {
					continue;
				}

				let html = '<a href="#" onclick="return to_edit_node(this, global_id);"><%:Edit%></a>';

				const m = cbid.match(/\.node$/);
				if (m) {
					html += '<a href="#" onclick="window.open(\'' + '<%=api.url("get_redir_log")%>?id=default' + '\', \'_blank\')"><%:Log%></a>';
				}

				html = '<div class="node-actions" style="display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap; margin-left:4px;">' + html + '</div>'

				const placeholder = node_select.parentElement.querySelector('.shunt-node-placeholder');
				if (placeholder) {
					placeholder.innerHTML = html;
				} else {
					node_select.insertAdjacentHTML("beforeend", html);
				}
			}
		}

		const socks = document.getElementById("cbi-<%=appname%>-socks");
		if (socks) {
			const socks_enabled_dom = document.getElementById("cbi-<%=appname%>-" + global_id + "-socks_enabled");
			const descr = socks.getElementsByClassName("cbi-section-descr")[0];
			descr.replaceWith(socks_enabled_dom);
			const rows = socks.getElementsByClassName("cbi-section-table-row");
			for (let i = 0; i < rows.length; i++) {
				try {
					const row = rows[i];
					const id = row.id;
					if (!id) continue;
					let dom_id = id + "-node";
					const cbid = dom_id.replace("cbi-", "cbid-").replace(new RegExp("-", 'g'), ".");
					dom_id = cbid + ".main";
					const node_select = document.getElementById(dom_id);
					if (!node_select) continue;

					let html = '<a href="#" onclick="return to_edit_node(this, \'socks\');"><%:Edit%></a>';
					html += '<a href="#" onclick="window.open(\'' + '<%=api.url("get_socks_log")%>?name=' + id.replace("cbi-<%=appname%>-", "") + '\', \'_blank\')"><%:Log%></a>';

					node_select.insertAdjacentHTML("afterend",
						'<div class="node-actions" style="display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap; margin-left:4px;">'  
						+ html + '</div>'
					);
				} catch(err) {
				}
			}
		}
	}

	(function () {
		let timer = null;
		let executed = false;
		let observer = null;
		const tryGo = () => {
			const count = document.querySelectorAll('[id^="cbid.<%=appname%>."][id$="node.main"]').length;
			if (count > 0 && !executed) {
				executed = true;
				if (observer) observer.disconnect();
				go();
			}
		};

		const scheduleGo = () => {
			if (executed) return;
			clearTimeout(timer);
			timer = setTimeout(tryGo, 60);
		};

		const target = document.getElementById("cbi-<%=appname%>-" + global_id) || document.body;
		observer = new MutationObserver(scheduleGo);
		observer.observe(target, { childList: true, subtree: true });

		if (document.readyState === "loading") {
			document.addEventListener("DOMContentLoaded", scheduleGo, { once: true });
		} else {
			scheduleGo();
		}
		setTimeout(() => {
			if (!executed) {
				executed = true;
				if (observer) observer.disconnect();
				go();
			}
		}, 1500);
	})();

	(function () {
		const addLogLink = (select) => {
			if (select.parentElement.querySelector("a.dns-log-link")) {
				return;
			}
			const logLink = document.createElement("a");
			logLink.innerHTML = "<%:Log%>";
			logLink.href = "#";
			logLink.className = "dns-log-link";
			logLink.style.marginLeft = "10px";
			logLink.setAttribute("onclick", "window.open('" + '<%=api.url("get_chinadns_log")%>' + "?flag=default', '_blank')");
			select.insertAdjacentElement("afterend", logLink);
		};

		const initDnsSelect = (dns_select) => {
			if (dns_select.value === "chinadns-ng") {
				addLogLink(dns_select);
			}
			if (dns_select._dnsLogBinded) return;
			dns_select._dnsLogBinded = true;

			dns_select.addEventListener("change", () => {
				const existingLogLink = dns_select.parentElement.querySelector("a.dns-log-link");
				if (existingLogLink) {
					existingLogLink.remove();
				}
				if (dns_select.value === "chinadns-ng") {
					addLogLink(dns_select);
				}
			});
		};

		const checkDns = () => {
			const dns_select = document.querySelector("select[id*='dns_shunt']");
			if (dns_select) {
				initDnsSelect(dns_select);
				return true;
			}
			return false;
		};

		if (!checkDns()) {
			const observer = new MutationObserver((mutations, obs) => {
				if (checkDns()) obs.disconnect();
			});
			observer.observe(document.body, { childList: true, subtree: true });
			setTimeout(() => observer.disconnect(), 3000);
		}
	})();

	(function () {
		function initSmartdnsDirectAuto() {
			const field = document.getElementById("cbi-<%=appname%>-" + global_id + "-smartdns_direct_dns");
			if (!field) return;

			const update = () => {
				const list = field.querySelector(".cbi-dynlist");
				if (!list) return;
				const hasDns = Array.from(list.querySelectorAll('.item > input[type="hidden"]'))
					.some(input => input.value.trim() !== "");
				const text = hasDns ? <%=api.jsonc.stringify(translate("-- Please choose --"))%> : "<%:Auto%>";
				const placeholder = list.querySelector(".add-item .cbi-dropdown > ul > li[placeholder]");
				// 只修改空选项的提示文字，不添加 DNS 条目，也不改变正在输入的内容。
				if (placeholder && placeholder.textContent !== text) {
					placeholder.textContent = text;
				}
				const input = list.querySelector('.add-item > input[type="text"]');
				if (input) input.placeholder = hasDns ? "" : "<%:Auto%>";
			};

			// 同时处理 LuCI 延迟渲染，以及添加、删除 DNS 后的空列表状态。
			new MutationObserver(update).observe(field, { childList: true, subtree: true });
			update();
		}

		if (document.readyState === "loading") {
			document.addEventListener("DOMContentLoaded", initSmartdnsDirectAuto, { once: true });
		} else {
			initSmartdnsDirectAuto();
		}
	})();
	//]]>
</script>
